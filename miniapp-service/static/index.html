<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Авто из Кореи</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="iconbtn" id="backBtn" type="button" aria-label="Назад" hidden>‹</button>
      <div class="topbar__text">
        <h1 id="pageTitle">Каталог</h1>
        <p id="pageSub">Загружаю…</p>
      </div>
      <span class="badge" id="modeBadge" hidden>mock</span>
    </header>

    <main class="view" id="view" aria-live="polite">
      <div class="skeleton-list">
        <div class="skeleton skeleton--card"></div>
        <div class="skeleton skeleton--card"></div>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Разделы">
      <button class="tab is-active" type="button" data-action="tab" data-tab="catalog">
        <span class="tab__icon">🚗</span><span>Каталог</span>
      </button>
      <button class="tab" type="button" data-action="tab" data-tab="price">
        <span class="tab__icon">💰</span><span>Подбор</span>
      </button>
      <button class="tab" type="button" data-action="tab" data-tab="calc">
        <span class="tab__icon">🧮</span><span>Расчёт</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
